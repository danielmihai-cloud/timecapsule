# Apache virtual host: the web root is public/, so .env, storage/ and the code are never downloadable.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Allow Laravel's public/.htaccess (URL rewriting to index.php)
        AllowOverride All
        Require all granted
    </Directory>

    # Logs go to the container output ("docker compose logs app")
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
