# Sample nginx site for TimeCapsule (Laravel) with PHP-FPM on Ubuntu.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/timecapsule
#           sudo ln -s /etc/nginx/sites-available/timecapsule /etc/nginx/sites-enabled/
#           sudo rm /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Only the public/ folder is reachable from the web (.env and storage/ are not).
    root /var/www/timecapsule/public;
    index index.php;

    # Slightly above MAX_UPLOAD_MB (5), like upload_max_filesize / post_max_size in php.ini.
    client_max_body_size 8M;

    charset utf-8;

    location / {
        # Serve real files (css, favicon); send everything else to Laravel's front controller.
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Hidden files (.env, .git, ...) are never served.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
